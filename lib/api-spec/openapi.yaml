openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Starlog API — a journal where thoughts live as stars in a personal constellation.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: sky
    description: The user's whole sky (stars, labels, connections, constellations)
  - name: stars
    description: Stars (topics/thoughts)
  - name: notes
    description: Journal notes inside a star
  - name: tasks
    description: To-dos inside a star
  - name: labels
    description: Color labels
  - name: connections
    description: Lines between stars
  - name: constellations
    description: Named groups of connected stars
  - name: demo
    description: Guest demo sky
  - name: export
    description: Journal export
  - name: dev
    description: Hidden developer tools (stress test)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /demo/start:
    post:
      tags: [demo]
      operationId: startDemo
      summary: Start a guest demo session with a freshly seeded sample sky
      description: Creates a temporary guest account seeded with ~15 stars, 4 labels and 3 named constellations, and sets the session cookie. Afterwards all sky endpoints work for the guest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoStartInput"
      responses:
        "200":
          description: Demo session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSession"
  /demo/end:
    post:
      tags: [demo]
      operationId: endDemo
      summary: End the guest demo session (deletes the guest sky)
      responses:
        "200":
          description: Demo ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /sky:
    get:
      operationId: getSky
      tags: [sky]
      summary: Get the whole sky for the current user
      responses:
        "200":
          description: The sky
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sky"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /preferences:
    patch:
      operationId: updatePreferences
      tags: [sky]
      summary: Save the signed-in user's display preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /sky/stats:
    get:
      operationId: getSkyStats
      tags: [sky]
      summary: Summary counts for the sky
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkyStats"
  /search:
    get:
      operationId: searchSky
      tags: [sky]
      summary: Search star titles and note text
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching stars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /on-this-day:
    get:
      operationId: getOnThisDay
      tags: [sky]
      summary: Notes written on today's day-of-month in an earlier month or year
      parameters:
        - name: tz
          in: query
          required: true
          description: IANA time zone of the viewer, e.g. America/Los_Angeles
          schema:
            type: string
      responses:
        "200":
          description: Matching notes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnThisDayNote"

  /dev/stress-stars:
    post:
      operationId: addStressStars
      tags: [dev]
      summary: Add random test stars to check rendering performance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StressInput"
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StressResult"
    delete:
      operationId: removeStressStars
      tags: [dev]
      summary: Remove all test stars created by the stress test
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StressResult"

  /stars:
    post:
      operationId: createStar
      tags: [stars]
      summary: Create a star
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Star"
  /stars/{starId}:
    parameters:
      - name: starId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateStar
      tags: [stars]
      summary: Update a star's title, position or label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Star"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteStar
      tags: [stars]
      summary: Delete a star with its notes and connections
      responses:
        "204":
          description: Deleted
  /stars/{starId}/notes:
    parameters:
      - name: starId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listStarNotes
      tags: [notes]
      summary: List notes in a star (oldest first)
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Add a note to a star
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
  /stars/{starId}/tasks:
    parameters:
      - name: starId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add a task to a star
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /stars/{starId}/task-order:
    parameters:
      - name: starId
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: setTaskOrder
      tags: [tasks]
      summary: Keep a manual task order for a star, or go back to automatic sorting (order null)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskOrderInput"
      responses:
        "204":
          description: Saved
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Edit or check off a task. Checking off a repeating task creates the next one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUpdateResult"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      responses:
        "204":
          description: Deleted
  /notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Edit a note (marks it edited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      responses:
        "204":
          description: Deleted

  /labels:
    get:
      operationId: listLabels
      tags: [labels]
      summary: List color labels with star counts
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
    post:
      operationId: createLabel
      tags: [labels]
      summary: Create a color label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
  /labels/{labelId}:
    parameters:
      - name: labelId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateLabel
      tags: [labels]
      summary: Rename or recolor a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
    delete:
      operationId: deleteLabel
      tags: [labels]
      summary: Delete a label (stars keep existing, unlabeled)
      responses:
        "204":
          description: Deleted

  /connections:
    post:
      operationId: createConnection
      tags: [connections]
      summary: Connect two stars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionInput"
      responses:
        "201":
          description: Created (or the existing connection if already connected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /connections/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Remove a connection line
      responses:
        "204":
          description: Deleted

  /constellations:
    post:
      operationId: createConstellation
      tags: [constellations]
      summary: Name the constellation that contains the anchor star
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstellationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constellation"
  /constellations/{constellationId}:
    parameters:
      - name: constellationId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateConstellation
      tags: [constellations]
      summary: Rename a constellation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstellationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constellation"
    delete:
      operationId: deleteConstellation
      tags: [constellations]
      summary: Remove a constellation name (connections stay)
      responses:
        "204":
          description: Deleted

  /export/json:
    get:
      operationId: exportJson
      tags: [export]
      summary: Download the whole journal as JSON (Content-Disposition attachment)
      responses:
        "200":
          description: JSON export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalExport"
  /export/markdown:
    get:
      operationId: exportMarkdown
      tags: [export]
      summary: Download the whole journal as Markdown (Content-Disposition attachment)
      responses:
        "200":
          description: Markdown export
          content:
            text/markdown:
              schema:
                type: string

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DemoStartInput:
      type: object
      properties:
        tz:
          type: string
          description: Viewer's IANA time zone, used to date some sample notes

    DemoSession:
      type: object
      required: [success, isDemo]
      properties:
        success:
          type: boolean
        isDemo:
          type: boolean

    Sky:
      type: object
      required: [isDemo, skyTheme, seenTips, labels, stars, connections, constellations, tasks]
      properties:
        isDemo:
          type: boolean
          description: True when the current session is a guest demo sky (not saved to an account)
        skyTheme:
          $ref: "#/components/schemas/SkyTheme"
        seenTips:
          type: array
          items:
            $ref: "#/components/schemas/TipId"
          description: Welcome tour and one-time tips this account has already seen
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        stars:
          type: array
          items:
            $ref: "#/components/schemas/Star"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        constellations:
          type: array
          items:
            $ref: "#/components/schemas/Constellation"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    SkyTheme:
      type: string
      enum: [black, milky-way, nebula, midnight, aurora]
      description: Backdrop drawn behind the stars

    TipId:
      type: string
      enum: [welcome, star-card, today]
      description: The welcome tour or a one-time tip

    Preferences:
      type: object
      required: [skyTheme, seenTips]
      properties:
        skyTheme:
          $ref: "#/components/schemas/SkyTheme"
        seenTips:
          type: array
          items:
            $ref: "#/components/schemas/TipId"

    PreferencesUpdate:
      type: object
      properties:
        skyTheme:
          $ref: "#/components/schemas/SkyTheme"
        seenTips:
          type: array
          maxItems: 10
          description: Tips to mark as seen (added to the ones already seen)
          items:
            $ref: "#/components/schemas/TipId"

    SkyStats:
      type: object
      required: [starCount, noteCount, labelCount, connectionCount, constellationCount, notesThisWeek, firstStarAt, lastNoteAt]
      properties:
        starCount: { type: integer }
        noteCount: { type: integer }
        labelCount: { type: integer }
        connectionCount: { type: integer }
        constellationCount: { type: integer }
        notesThisWeek: { type: integer }
        firstStarAt:
          type: [string, "null"]
          format: date-time
        lastNoteAt:
          type: [string, "null"]
          format: date-time

    SearchResult:
      type: object
      required: [starId, title, matchedIn, snippet]
      properties:
        starId: { type: integer }
        title: { type: string }
        matchedIn:
          type: string
          enum: [title, note]
        snippet:
          type: string
          description: Short excerpt around the match (the title when matchedIn is title)

    OnThisDayNote:
      type: object
      required: [noteId, starId, starTitle, snippet, createdAt]
      properties:
        noteId: { type: integer }
        starId: { type: integer }
        starTitle: { type: string }
        snippet: { type: string }
        createdAt: { type: string, format: date-time }

    StressInput:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 500

    StressResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          description: Number of test stars added or removed

    Star:
      type: object
      required: [id, title, x, y, labelId, noteCount, taskOrder, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        taskOrder:
          type: string
          enum: [auto, manual]
        x:
          type: number
          description: World-space x coordinate
        y:
          type: number
          description: World-space y coordinate
        labelId:
          type: [integer, "null"]
        noteCount:
          type: integer
          description: Number of notes in this star (drives star size)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StarInput:
      type: object
      required: [x, y]
      properties:
        title:
          type: string
          maxLength: 200
          description: Defaults to "Untitled star"
        x: { type: number }
        y: { type: number }
        labelId:
          type: [integer, "null"]
    StarUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        x: { type: number }
        y: { type: number }
        labelId:
          type: [integer, "null"]

    Note:
      type: object
      required: [id, starId, body, createdAt, editedAt, pinned]
      properties:
        id: { type: integer }
        starId: { type: integer }
        body: { type: string }
        pinned:
          type: boolean
          description: Pinned notes stay at the top of the star's thread
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
          description: Set when the note body was changed after creation
    Task:
      type: object
      required: [id, starId, title, dueDate, priority, repeat, done, doneAt, position, createdAt]
      properties:
        id: { type: integer }
        starId: { type: integer }
        title: { type: string }
        dueDate:
          type: [string, "null"]
          description: Calendar day, YYYY-MM-DD
        priority:
          $ref: "#/components/schemas/TaskPriority"
        repeat:
          type: [string, "null"]
          enum: [daily, weekly, monthly, null]
        done: { type: boolean }
        doneAt:
          type: [string, "null"]
          format: date-time
        position: { type: integer }
        createdAt:
          type: string
          format: date-time
    TaskPriority:
      type: string
      enum: [low, normal, high]
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        dueDate:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        repeat:
          type: [string, "null"]
          enum: [daily, weekly, monthly, null]
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        dueDate:
          type: [string, "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        repeat:
          type: [string, "null"]
          enum: [daily, weekly, monthly, null]
        done: { type: boolean }
        today:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: The user's local date, used to schedule the next instance of a repeating task
    TaskUpdateResult:
      type: object
      required: [task, next]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        next:
          oneOf:
            - $ref: "#/components/schemas/Task"
            - type: "null"
    TaskOrderInput:
      type: object
      required: [order]
      properties:
        order:
          type: [array, "null"]
          maxItems: 2000
          items: { type: integer }

    NoteInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 20000
    NoteUpdate:
      type: object
      properties:
        body:
          type: string
          maxLength: 20000
        pinned:
          type: boolean

    Label:
      type: object
      required: [id, name, color, starCount, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        color:
          type: string
          description: Hex color like "#8FB3E8"
        starCount: { type: integer }
        createdAt:
          type: string
          format: date-time
    LabelInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
    LabelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"

    Connection:
      type: object
      required: [id, fromStarId, toStarId, createdAt]
      properties:
        id: { type: integer }
        fromStarId: { type: integer }
        toStarId: { type: integer }
        createdAt:
          type: string
          format: date-time
    ConnectionInput:
      type: object
      required: [fromStarId, toStarId]
      properties:
        fromStarId: { type: integer }
        toStarId: { type: integer }

    Constellation:
      type: object
      required: [id, name, anchorStarId, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        anchorStarId:
          type: integer
          description: A star in the group. The constellation is the connected component (via connections) containing this star; the client computes its members and places the name near their centroid.
        createdAt:
          type: string
          format: date-time
    ConstellationInput:
      type: object
      required: [name, anchorStarId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        anchorStarId: { type: integer }
    ConstellationUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60

    ExportNote:
      type: object
      required: [body, createdAt, editedAt]
      properties:
        body: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt:
          type: [string, "null"]
          format: date-time
    ExportStar:
      type: object
      required: [id, title, label, x, y, createdAt, notes]
      properties:
        id: { type: integer }
        title: { type: string }
        label:
          type: [string, "null"]
        x: { type: number }
        y: { type: number }
        createdAt: { type: string, format: date-time }
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ExportNote"
    JournalExport:
      type: object
      required: [exportedAt, labels, stars, connections, constellations]
      properties:
        exportedAt: { type: string, format: date-time }
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        stars:
          type: array
          items:
            $ref: "#/components/schemas/ExportStar"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        constellations:
          type: array
          items:
            $ref: "#/components/schemas/Constellation"
